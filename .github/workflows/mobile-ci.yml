name: Mobile CI

# Only runs against mobile/ changes - this repo's web app has no CI of its
# own yet (relies on Vercel's own build step + this project's own typecheck-
# before-commit discipline, per CLAUDE.md's Repo/Workflow Conventions), so
# this is scoped narrowly rather than becoming a general-purpose CI file.
on:
  push:
    branches: [main]
    paths: ["mobile/**"]
  pull_request:
    paths: ["mobile/**"]
  workflow_dispatch: {}

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      # Pinned to the exact stable version this project was built/verified
      # against (see docs/build-log.md's 2026-08-10 mobile entries) rather
      # than "stable" floating, so CI doesn't drift out from under local dev.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: "stable"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # No local Java/Android SDK exists in the dev sandbox this project has been
  # built in (see CLAUDE.md's standing caveat), so this is the first place a
  # real native Android build has ever actually run - GitHub's ubuntu-latest
  # runners ship a preinstalled Android SDK, no separate setup needed here.
  # Signed with a persisted release key when the ANDROID_KEYSTORE_BASE64
  # secret is set (see the generate-keystore job below to create one), falls
  # back to Flutter's own debug key otherwise. Either way this is a
  # self-signed sideload key, not a Play Store submission key.
  build-android-apk:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    # `if:` conditionals can't reference `secrets` directly (a real GitHub
    # Actions restriction, not a typo) - routed through a job-level env var
    # instead, which `if:` can read.
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: "stable"

      - run: flutter pub get

      # Only runs once the ANDROID_KEYSTORE_BASE64/ANDROID_KEYSTORE_PASSWORD
      # secrets exist (see the generate-keystore job) - without them the
      # build falls through to android/app/build.gradle.kts's debug-key
      # fallback, so this workflow keeps working before that one-time setup.
      - name: Configure release signing
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          cat > android/app/key.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=typmobile
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EOF

      # Bakes the real deployed backend in at build time (see lib/services/
      # api_client.dart's ApiClient.baseUrl) instead of the local-dev default
      # - without this, a sideloaded APK can install fine but every API call
      # fails since it's still pointed at the build machine's own localhost.
      - run: flutter build apk --release --dart-define=API_BASE_URL=https://testingyourpreparedness.com

      - uses: actions/upload-artifact@v4
        with:
          name: typ-android-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # One-time, manually-triggered helper - not part of the normal build path.
  # Run once via the Actions tab (workflow_dispatch), download the artifact,
  # then add its two values as repo secrets (Settings -> Secrets and
  # variables -> Actions): ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD.
  # After that, every future build-android-apk run signs with this same key
  # instead of a fresh throwaway one, so new builds install over old ones
  # instead of Android rejecting them as a signature mismatch.
  generate-keystore:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Generate a release keystore
        run: |
          PASSWORD=$(openssl rand -base64 24)
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias typmobile \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -dname "CN=TYP, OU=Mobile, O=Akrynix Labs, L=Accra, ST=Greater Accra, C=GH"
          base64 -w0 release.keystore > release.keystore.base64.txt
          echo "$PASSWORD" > keystore-password.txt

      - uses: actions/upload-artifact@v4
        with:
          name: typ-release-keystore-SAVE-THEN-DELETE
          path: |
            release.keystore.base64.txt
            keystore-password.txt
          retention-days: 1
