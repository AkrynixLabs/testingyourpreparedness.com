name: typ_mobile
description: TYP mobile app - BECE/WASSCE exam prep, student v1 (login, exams, results).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  # Renders Paystack's own hosted checkout page for a course purchase (no
  # raw card entry in this app, same rule the web app follows) - the
  # purchase screen intercepts navigation back to the app's real checkout-
  # callback URL rather than letting it actually load in the webview.
  webview_flutter: ^4.10.0
  # Opens a lesson's external video URL in the system browser/app - mirrors
  # the web app's own lesson-viewer.tsx exactly (an <a target="_blank">,
  # not an embedded player), since lesson videos can be any external host
  # (YouTube, Vimeo, a raw file) a single video-embed package can't all play.
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

# Source: mobile/assets/branding/app_icon.svg, generated from the web app's
# real public/icon.svg mark - that source file's fill colors only exist
# inside a light/dark `prefers-color-scheme` media query, which app-icon
# tooling (and most SVG rasterizers) doesn't evaluate, so the color scheme
# was hardcoded rather than left theme-reactive. Confirmed with the user:
# brand primary blue (#0072D5, app_theme.dart's real light-theme `primary`,
# not an arbitrary color) background with the white mark, not the web
# favicon's literal black/white light-mode variant.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  # Android adaptive icon: platform composites its own background shape/mask
  # around a foreground layer, so the foreground here is markonly
  # (transparent bg, already inset well within the safe zone) rather than
  # reusing the flat composited image_path above.
  adaptive_icon_background: "#0072D5"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  remove_alpha_ios: true

# Background matches app_theme.dart's real primary color for each mode
# (light: #0072D5, dark: #0F92F7) - same OKLCH-derived tokens the rest of
# the app's theme uses, not a separately-invented splash color.
flutter_native_splash:
  color: "0072D5"
  image: assets/branding/splash_logo.png
  color_dark: "0F92F7"
  image_dark: assets/branding/splash_logo.png
  android_12:
    image: assets/branding/splash_logo.png
    icon_background_color: "0072D5"
    image_dark: assets/branding/splash_logo.png
    icon_background_color_dark: "0F92F7"
